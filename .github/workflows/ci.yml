name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agent_relay
          POSTGRES_PASSWORD: agent_relay
          POSTGRES_DB: agent_relay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_relay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run starter's tests (SQLite)
        run: uv run pytest -q

      - name: Run integration tests (PostgreSQL)
        env:
          RELAY_DATABASE_URL: postgresql+psycopg://agent_relay:agent_relay@localhost:5432/agent_relay
        run: uv run pytest -q

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t agent-relay:local .

      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: kind

      - name: Load image into kind
        run: kind load docker-image agent-relay:local --name kind

      - name: Deploy manifests
        run: kubectl apply -f k8s/

      - name: Wait for rollout
        run: |
          kubectl rollout status deploy/postgres --timeout=120s
          kubectl rollout status deploy/agent-relay --timeout=120s

      - name: Verify readiness
        run: |
          kubectl port-forward svc/agent-relay 8000:8000 &
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8000/ready; then exit 0; fi
            sleep 3
          done
          echo "agent-relay never became ready" >&2
          exit 1
